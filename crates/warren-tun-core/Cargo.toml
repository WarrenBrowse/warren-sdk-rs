[package]
name = "warren-tun-core"
description = "Shim: re-exports the engine's warrenguard-tun-core (safe TUN seam). Kept so the SDK's userland consumers keep the warren_tun_core path during convergence."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
warrenguard-tun-core = { workspace = true }

[features]
# Forwarded to the engine crate: gates the live-host routing-table probes.
experimental-tun = ["warrenguard-tun-core/experimental-tun"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
