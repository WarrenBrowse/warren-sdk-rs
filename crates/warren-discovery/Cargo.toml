[package]
name = "warren-discovery"
description = "Warren exit discovery: verify the Ed25519-signed relay list (pinned server pubkey, anti-rollback, anti-freeze) and select an exit by geography, weight and IP availability. Pure: the HTTP fetch lives in warren-api."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Exposes server-side signing helpers (signed-list and multihop-directory
# minting) for tests in OTHER crates. Off by default so these fixtures never
# enter the production-compiled surface; enabled via the dev-dependency.
test-helpers = []

[dependencies]
warren-identity = { path = "../warren-identity" }
ed25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
