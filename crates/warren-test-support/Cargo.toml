[package]
name = "warren-test-support"
description = "Test-only helpers shared across the Warren SDK workspace (in-process fake exit). Never published; used as a dev-dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
warren-transport = { path = "../warren-transport" }
warren-wire = { path = "../warren-wire" }
# Single home of the client ALPN, so the fake exit matches the real client.
warrenguard-config = { workspace = true }
ed25519-dalek = { workspace = true }
quinn = { workspace = true }
tokio = { workspace = true }
# Exit-side HPKE for the fake multihop exit: independently re-derives the
# per-frame key/AAD (not shared with warren-multihop) so the round-trip proves
# wire interop, not just internal consistency.
hpke = { version = "=0.13.0", default-features = false, features = [
    "alloc",
    "x25519",
] }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = [
    "alloc",
] }
rand_core = { version = "0.9", default-features = false, features = ["os_rng"] }
# A server-side smoltcp stack for the netstack-terminating fake exit, so the
# full proxy datapath can be exercised in-process.
smoltcp = { version = "0.14", default-features = false, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "socket-tcp",
] }

# A port-entitlement issuer behind warren-api's transport seam (`issuer`), so
# the SDK's real entitlement manager mints and vends envelopes in a test.
warren-api = { path = "../warren-api" }
warren-contract = { workspace = true }
warrenguard-token = { workspace = true }
rand010 = { package = "rand", version = "0.10" }
serde_json = { workspace = true }
data-encoding = { workspace = true }
hex = { workspace = true }
# The engine's NAT-PMP server behind the credential-requiring harness in
# `natpmp`, so the SDK's port-forward client is tested against the gateway
# exits run rather than a scripted fake.
warrenguard-natpmp-server = { workspace = true }

[lints]
workspace = true
