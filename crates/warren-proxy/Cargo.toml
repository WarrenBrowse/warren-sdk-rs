[package]
name = "warren-proxy"
description = "Headless Warren proxy daemon: a supervised SOCKS5/HTTP CONNECT tunnel endpoint with env-first configuration for containers, servers and NAS boxes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "warren-proxy"
path = "src/main.rs"

[dependencies]
warren-sdk = { path = "../warren-sdk" }
tokio = { workspace = true, features = ["signal", "process", "fs"] }
anyhow = "1"
thiserror = { workspace = true }
zeroize = { workspace = true }

# Signalling a process GROUP: a hook is a shell line, so its own children are
# what holds a port open past the budget, and `Child::kill` reaches the shell
# alone. `killpg` is safe, and this workspace forbids unsafe.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

[lints]
workspace = true
