[package]
name = "warren-proxy"
description = "Headless Warren proxy daemon: a supervised SOCKS5/HTTP CONNECT tunnel endpoint with env-first configuration for containers, servers and NAS boxes"
# Its own version series: this binary is released on its own tag
# (`proxy-v*`), and the release pipeline refuses a tag whose version
# differs from this line.
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "warren-proxy"
path = "src/main.rs"

[dependencies]
warren-sdk = { path = "../warren-sdk" }
# The daemon skeleton both headless binaries share: env parsing, candidate
# selection, hooks, the health endpoint, signals and process hardening.
warren-headless = { path = "../warren-headless" }
tokio = { workspace = true, features = ["signal"] }
anyhow = "1"
zeroize = { workspace = true }

[lints]
workspace = true
