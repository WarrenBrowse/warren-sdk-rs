[package]
name = "warren-daita"
description = "Warren DAITA v2 client surface: a re-export of the engine's warrenguard-daita (wire DaitaConfig, curated machine pool, event/timer state machine) shared with warren-core, keeping the behavioural-equivalence tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
warrenguard-daita = { path = "../../../warrenguard/crates/warrenguard-daita" }

[dev-dependencies]
serde_json = { workspace = true }
# The behavioural-equivalence tests build curated machines directly and feed the
# re-exported engine state machine. Pinned to match the engine's maybenot so the
# serialized specs are byte-identical.
maybenot = "=2.2.2"
maybenot-machines = "=1.0.1"
rand = "0.9"

[lints]
workspace = true
