[package]
name = "warren-transport"
description = "Warren QUIC transport: TLS 1.3 raw-public-key handshake (quinn + rustls), identity-bound Setup/SetupAck exchange, ClientSession with RFC 9221 datagrams. Wire-compatible with warren-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
warren-wire = { path = "../warren-wire" }
warren-multihop = { path = "../warren-multihop" }
ed25519-dalek = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
data-encoding = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
# rand_core 0.9 OsRng for the per-session HPKE ephemeral keypair (hpke 0.13
# expects the 0.9 trait surface, matching warren-multihop).
rand_core = { version = "0.9", default-features = false, features = ["os_rng"] }

[dev-dependencies]
tokio = { workspace = true }
ed25519-dalek = { workspace = true }
warren-wire = { path = "../warren-wire" }
warren-test-support = { path = "../warren-test-support" }

[lints]
workspace = true
