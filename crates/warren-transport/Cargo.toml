[package]
name = "warren-transport"
description = "Warren QUIC transport: TLS 1.3 raw-public-key handshake (quinn + rustls), identity-bound Setup/SetupAck exchange, ClientSession with RFC 9221 datagrams. Wire-compatible with warren-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# RPK TLS 1.3 config + SNI pubkey codec, shared with warren-core (the tls module
# is a re-export of this engine crate).
warrenguard-tls = { workspace = true }
# Opt-in TLS-over-TCP fallback carrier: the client shim (TcpCarrierSocket +
# build_carrier_client_endpoint), the cover-domain TLS connector, and the
# auto-activation policy (connect_with_fallback) that the dial races the UDP
# handshake against. Off by default (see `client::dial_quic_with_fallback`).
warrenguard-tcp-fallback = { workspace = true }
# Name the plain rustls ClientConfig used for the cover-domain TLS handshake of
# the fallback carrier (built from the WebPKI roots + a plausible TCP ALPN).
rustls = { workspace = true }
# Direct engine dep for the relay-auth proof codec (decode_relay_auth_proof,
# RELAY_AUTH_PROOF_LEN) used in the X.509 cover-domain handshake (ADR-0004).
warrenguard-multihop = { workspace = true }
# The multihop protocol engine (HPKE seal/open, rekey/epoch, setup-over-stream,
# datagram send/recv): MultihopSession/MultihopClientTunnel below own a
# `warrenguard_transport::multihop::MultiHopClient` and delegate to it, so the
# protocol logic lives once, shared with warren-core via the same engine crate.
# `client` (single-hop) mirrors this: ClientSession/ClientTunnel own a
# `warrenguard_transport::client::{ClientSession, ClientTunnel}`.
warrenguard-transport = { workspace = true }
# Sealed error type of `warrenguard_transport::client`'s Result, needed to name
# and map its variants in `client::map_engine_err`.
warrenguard-transport-core = { workspace = true }
# `CoverDefenses` + `cover_defenses()`: the resolved DAITA / idle-cover knob
# switch the client builder threads (`ClientTunnel::with_cover_defenses`).
warrenguard-config = { workspace = true }
# Single home of the idle-cover scheduler + driver (CoverSink / IdleCoverDriver);
# the SDK sessions implement the trait and re-export the driver.
warrenguard-pump = { workspace = true }
# Full-jitter reconnection backoff, single-homed in the engine (re-exported by
# the `reconnect` module so the SDK and warren-core share one schedule).
warrenguard-backoff = { workspace = true }
# Per-OS carrier-socket bypass (SO_MARK / IP_BOUND_IF / IP_UNICAST_IF): the
# privileged TUN datapath marks/binds the QUIC socket to the physical link so
# the split-default tunnel can drop the old `<exit_ip>/32` host route (Port Fail
# / TunnelCrack ServerIP fix). Lightweight (libc/windows-sys only) and the
# userland proxy simply configures no bypass, so it stays in that closure too.
warrenguard-socket-bypass = { workspace = true }
warren-wire = { path = "../warren-wire" }
warren-multihop = { path = "../warren-multihop" }
warren-daita = { path = "../warren-daita" }
ed25519-dalek = { workspace = true }
quinn = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
# rand_core 0.9 OsRng for the per-session HPKE ephemeral keypair (hpke 0.13
# expects the 0.9 trait surface, matching warren-multihop).
rand_core = { version = "0.9", default-features = false, features = ["os_rng"] }

[dev-dependencies]
# test-util enables `tokio::time` pause/auto-advance so the reconnect backoff
# tests run deterministically without real sleeps.
tokio = { workspace = true, features = ["test-util"] }
# Self-signed cover certificate for the loopback TLS-over-TCP fallback e2e test
# (a real cover-domain TLS handshake, terminated by the engine `serve_carrier`).
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
ed25519-dalek = { workspace = true }
warren-wire = { path = "../warren-wire" }
warren-test-support = { path = "../warren-test-support" }
# Re-derives the real exit's Ed25519 RPK from its BIP39 mnemonic so the
# WARREN_EXIT_BIN integration test can pin it (wire-compat: same derivation
# the reference exit uses). Leaf crate, no dependency cycle.
warren-identity = { path = "../warren-identity" }
# test-helpers exposes IpAssignment::placeholder_for_test for the raw multihop
# session built in the WARREN_EXIT_BIN rekey-driver test (dev-only feature).
warren-multihop = { path = "../warren-multihop", features = ["test-helpers"] }
tempfile = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
