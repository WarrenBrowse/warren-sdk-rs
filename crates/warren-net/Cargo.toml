[package]
name = "warren-net"
description = "Warren networking backends behind one seam: a non-root userspace proxy (SOCKS5/HTTP CONNECT) datapath (default, all OSes) and an optional privileged TUN datapath with routing, DNS and killswitch. The QUIC packet plane and SOCKS5 codec are implemented and tested; per-OS TUN/killswitch back ends are feature-gated."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
warren-transport = { path = "../warren-transport" }
# NAT-PMP wire codec for the port-forwarding client (RFC 6886 + Warren trailer).
warren-wire = { path = "../warren-wire" }
# Shared reduced-MTU adaptation helpers (SYN/SYN-ACK MSS clamp, ICMP
# Fragmentation-Needed / Packet-Too-Big synthesis): the TUN datapath's own pump
# (`tun_sink`) needs the same sender-side fix the engine's `supervised_pump`
# already has, since this SDK does not ride that pump. Always-on (not
# feature-gated): `tun_sink` itself compiles unconditionally.
warrenguard-transport-core = { workspace = true }
# The tunnel gateway constants (`TUNNEL_GATEWAY_IP`/`TUNNEL_GATEWAY_IPV6`), used
# as the reflected ICMP's source address in the TUN uplink pump.
warrenguard-config = { workspace = true }
# The TUN bridge needs only the safe seam (the `RawTunDevice` trait + framing) to
# adapt an injected device to a `PacketSink`; this is the always-on, unsafe-free,
# privileged-code-free core. The real kernel device open lives in `warren-tun`,
# pulled in only under `experimental-tun` so a userland build never reaches it.
warren-tun-core = { path = "../warren-tun-core" }
warren-tun = { path = "../warren-tun", optional = true }
bytes = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
rand = { workspace = true }
thiserror = { workspace = true }
# Userspace TCP/IP for the non-root proxy datapath (Medium::Ip, no Ethernet:
# the tunnel carries bare IP packets). 0.13 requires rustc 1.91 > our MSRV.
smoltcp = { version = "0.12", default-features = false, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    # UDP socket for DNS-over-tunnel resolution to the gateway forwarder.
    "socket-udp",
], optional = true }

[features]
# The non-root proxy datapath is always available. `tun` and `killswitch` pull
# in the privileged per-OS back ends (implemented incrementally per platform).
default = ["proxy"]
proxy = ["dep:smoltcp"]
tun = []
killswitch = []
# Enables the real-fd TUN datapath driver (the async duplex loop over a kernel
# device); pulls warren-tun's privileged device open. EXPERIMENTAL, unvalidated.
experimental-tun = ["dep:warren-tun", "warren-tun/experimental-tun"]

[dev-dependencies]
# `test-util` enables `start_paused` for the NAT-PMP retransmit/refresh tests.
tokio = { workspace = true, features = ["test-util"] }
ed25519-dalek = { workspace = true }
warren-test-support = { path = "../warren-test-support" }
# Golden-byte assertions for the DNS codec tests.
hex = { workspace = true }
# Bytes for the UDP-flow connector used in the UDP-associate proxy test.
bytes = { workspace = true }
# A second smoltcp stack stands in for the exit's TCP termination in the
# netstack loopback test.
smoltcp = { version = "0.12", default-features = false, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "socket-tcp",
    # The test exit answers DNS over UDP for the DNS-over-tunnel test.
    "socket-udp",
] }

[lints]
workspace = true
