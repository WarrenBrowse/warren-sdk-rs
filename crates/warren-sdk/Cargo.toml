[package]
name = "warren-sdk"
description = "Warren VPN client SDK: the single, ergonomic entry point applications depend on. Composes identity, the signed account API, exit discovery, the QUIC transport and the networking backends behind one WarrenClient facade."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
warren-identity = { path = "../warren-identity" }
warren-api = { path = "../warren-api" }
warren-discovery = { path = "../warren-discovery" }
warren-transport = { path = "../warren-transport" }
warren-net = { path = "../warren-net" }
warren-daita = { path = "../warren-daita" }
# Privileged TUN device open for the experimental `start_tun_multihop` facade
# (feature-gated; the default build pulls none of it and stays unsafe-free).
warren-tun = { path = "../warren-tun", optional = true }
# Safe `if_nametoindex` for the macOS carrier-socket `IP_BOUND_IF` bypass in
# `start_tun_multihop` (Port Fail fix): the workspace forbids unsafe, so the FFI
# is delegated to nix rather than an in-crate `libc` call. Feature-gated with the
# TUN facade, so the default userland build never pulls it.
nix = { version = "0.30", default-features = false, features = ["net"], optional = true }
thiserror = { workspace = true }
# Needed to bind the local SOCKS5 listener and spawn the proxy datapath task.
tokio = { workspace = true }
# Parse the am.i.warren egress-oracle verdict (control-plane leak self-check).
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# Bundle the reqwest transport so an app can build a working client with one
# dependency. Apps that bring their own HttpTransport can disable it.
default = ["reqwest-transport"]
reqwest-transport = ["warren-api/reqwest-transport"]
# The experimental privileged TUN datapath facade (`start_tun_multihop`). Pulls
# warren-tun's device open + warren-net's TUN datapath. EXPERIMENTAL, Unix-only,
# NOT yet validated against a real exit (needs root + a device).
experimental-tun = ["dep:warren-tun", "dep:nix", "warren-net/experimental-tun"]

# Document the full surface on docs.rs (the facade re-exports every layer).
[package.metadata.docs.rs]
all-features = true

# The privileged TUN validation harness builds only with the feature (and runs
# only with root + a device + a live exit). Skipped by a plain `cargo build`.
[[example]]
name = "live_tun"
required-features = ["experimental-tun"]

[dev-dependencies]
tokio = { workspace = true }
ed25519-dalek = { workspace = true }
# Enable the directory/relay-list minting helpers for facade tests (test-only;
# the feature is off in production builds, which never compile dev-dependencies).
warren-discovery = { path = "../warren-discovery", features = ["test-helpers"] }
warren-test-support = { path = "../warren-test-support" }
serde_json = { workspace = true }
hex = { workspace = true }
bytes = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
