[package]
name = "warren-sdk"
description = "Warren VPN client SDK: the single, ergonomic entry point applications depend on. Composes identity, the signed account API, exit discovery, the QUIC transport and the networking backends behind one WarrenClient facade."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
warren-identity = { path = "../warren-identity" }
warren-api = { path = "../warren-api" }
warren-discovery = { path = "../warren-discovery" }
warren-transport = { path = "../warren-transport" }
warren-net = { path = "../warren-net" }
warren-daita = { path = "../warren-daita" }
# Single home of the product anchors (API base URL) and the QUIC/tunnel
# constants (gateway IP, pool prefix, initial MTU) the datapath addresses with,
# so the SDK imports them rather than re-declaring drifting copies.
warren-contract = { workspace = true }
warrenguard-config = { workspace = true }
# Privileged TUN device open for the experimental `start_tun_multihop` facade
# (feature-gated; the default build pulls none of it and stays unsafe-free).
warren-tun = { path = "../warren-tun", optional = true }
# Single home of the per-OS carrier-socket bypass picker
# (`socket_bypass::tunnel_socket_bypass`): the experimental TUN datapath
# delegates to it rather than re-deriving the mechanism (doc-94 B2). Privileged
# (pulls the OS killswitch), so it is gated with the TUN facade and never enters
# the default userland closure.
warrenguard-route-split = { workspace = true, optional = true }
# The OS killswitch the privileged TUN datapath installs so it fails closed (pf
# sub-anchor on macOS, nft table on Linux). Single home shared with the app-scope
# system-VPN, replacing the deleted in-tree plan/apply killswitch (doc-94 B1).
warrenguard-killswitch-os = { workspace = true, optional = true }
thiserror = { workspace = true }
# Emit the SDK-side migration watchdog decisions (escape refused, rebind
# failed, epoch ended); the engine loop traces the nominal chain itself.
tracing = { workspace = true }
# Needed to bind the local SOCKS5 listener and spawn the proxy datapath task.
tokio = { workspace = true }
# Parse the am.i.warren egress-oracle verdict (control-plane leak self-check).
serde = { workspace = true }
serde_json = { workspace = true }
# Frame the in-tunnel egress-probe DNS query into the netstack UDP send path.
bytes = { workspace = true }

[features]
# Bundle the reqwest transport so an app can build a working client with one
# dependency. Apps that bring their own HttpTransport can disable it.
# `pq-hpke` is on by default so the multihop dial prefers the post-quantum
# X-Wing seal (inert until an exit advertises a signed ML-KEM key).
default = ["reqwest-transport", "pq-hpke"]
reqwest-transport = ["warren-api/reqwest-transport"]
# Forwards the post-quantum X-Wing multihop seal preference to the transport.
pq-hpke = ["warren-transport/pq-hpke"]
# Socket-marked control-plane transport for the privileged daemon (warrend): its
# control-plane fetch carries the Warren tunnel fwmark so a `meta mark` lockdown
# guard permits it. Off by default (only the daemon needs it).
marked-transport = ["warren-api/marked-transport"]
# The experimental privileged TUN datapath facade (`start_tun_multihop`). Pulls
# warren-tun's device open + warren-net's TUN datapath. EXPERIMENTAL, Unix-only,
# NOT yet validated against a real exit (needs root + a device).
experimental-tun = [
    "dep:warren-tun",
    "dep:warrenguard-route-split",
    "dep:warrenguard-killswitch-os",
    "warren-net/experimental-tun",
]

# Document the full surface on docs.rs (the facade re-exports every layer).
[package.metadata.docs.rs]
all-features = true

# The privileged TUN validation harness builds only with the feature (and runs
# only with root + a device + a live exit). Skipped by a plain `cargo build`.
[[example]]
name = "live_tun"
required-features = ["experimental-tun"]

[dev-dependencies]
# `test-util` enables `start_paused` for the egress-probe scheduler tests.
tokio = { workspace = true, features = ["test-util"] }
ed25519-dalek = { workspace = true }
# Builds the datagram-refusal the uplink drop counter is pinned on.
quinn = { workspace = true }
# Enable the directory/relay-list minting helpers for facade tests (test-only;
# the feature is off in production builds, which never compile dev-dependencies).
warren-discovery = { path = "../warren-discovery", features = ["test-helpers"] }
warren-test-support = { path = "../warren-test-support" }
serde_json = { workspace = true }
hex = { workspace = true }
bytes = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
