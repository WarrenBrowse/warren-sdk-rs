[package]
name = "warren-multihop"
description = "Warren multihop HPKE session: client-side RFC 9180 (DHKEM-X25519/HKDF-SHA256/ChaCha20Poly1305) sealing of the WarrenMultihopFrame. Wire-compatible with warren-core warren-multihop."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Exposes test-only constructors (e.g. `IpAssignment::placeholder_for_test`) for
# downstream harnesses that bypass the real setup exchange. OFF by default; only
# ever enabled as a dev-dependency feature, never in a production dependency.
test-helpers = []

[dependencies]
warren-wire = { path = "../warren-wire" }
thiserror = { workspace = true }
# Ed25519 for the multihop proof of possession (account-key signature binding
# the session's encapsulated key + exit_id). Same crate/features as identity.
ed25519-dalek = { workspace = true }
# HPKE RFC 9180 (NOT hpke-rs/Cryspen). Pinned to match warren-core's wire output.
hpke = { version = "=0.13.0", default-features = false, features = ["alloc", "x25519"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
# hpke 0.13 expects the rand_core 0.9 CryptoRng/RngCore trait surface.
rand_core = { version = "0.9", default-features = false, features = ["os_rng"] }
# Zeroize the per-packet symmetric key after use (secret hygiene, matches core).
zeroize = { workspace = true }

[dev-dependencies]
# Deterministic RNG (rand_core 0.9 traits) for the HPKE round-trip test.
rand_chacha = "0.9"
# Replaying the shared cross-language PoP golden vector (vectors/pop.json).
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
