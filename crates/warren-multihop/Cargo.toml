[package]
name = "warren-multihop"
description = "Warren multihop HPKE session: client-side RFC 9180 (DHKEM-X25519/HKDF-SHA256/ChaCha20Poly1305) sealing of the WarrenMultihopFrame. Wire-compatible with warren-core warren-multihop."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Forwards to the engine's test-only constructors (e.g.
# `IpAssignment::placeholder_for_test`) for downstream harnesses that bypass the
# real setup exchange. OFF by default; only ever enabled as a dev-dependency
# feature, never in a production dependency.
test-helpers = ["warrenguard-multihop/test-helpers"]

[dependencies]
# The multihop HPKE session + setup + replay + pop now live in the engine; this
# crate is a thin re-export so a single implementation is shared with warren-core.
warrenguard-multihop = { path = "../../../warrenguard/crates/warrenguard-multihop" }

[dev-dependencies]
# The PoP golden-vector replay builds a SigningKey directly.
ed25519-dalek = { workspace = true }
# The datapath bench reaches the frame codec + a deterministic RNG directly.
warren-wire = { path = "../warren-wire" }
rand_chacha = "0.9"
rand_core = { version = "0.9", default-features = false, features = ["os_rng"] }
# Replaying the shared cross-language PoP golden vector (vectors/pop.json).
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
# Direct postcard access for the datapath bench's grow-vs-presize comparison.
postcard = { workspace = true }


[lints]
workspace = true
