[package]
name = "warren-bolthole"
description = "Local WireGuard-protocol gateway: terminates stock WireGuard-protocol clients on the LAN and carries their traffic through a Warren exit, with the peers' packets translated onto the single address the exit assigned"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "warren-bolthole"
path = "src/main.rs"

[dependencies]
warren-bolthole-core = { path = "../warren-bolthole-core" }
warren-headless = { path = "../warren-headless" }
warren-sdk = { path = "../warren-sdk" }
bytes = { workspace = true }
ip_network = "0.4.1"
# Non-poisoning mutexes: an unauthenticated datagram must never be able to
# leave the responder or the NAT unusable for every peer through a panic in
# one packet's handling.
parking_lot = "0.12"
tokio = { workspace = true }
anyhow = "1"
thiserror = { workspace = true }
zeroize = { workspace = true }

# A terminal QR of a client configuration, for a phone or a TV. A plain
# dependency, not an optional one: `cargo deny` scans the default features, so
# a feature-gated renderer would ship in the release binaries without ever
# having been through the licence and advisory gate. Default features off: the
# image renderers are what a headless host never wants.
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
# The stock client of the integration test: the only way to prove the gateway
# against the protocol rather than against its own idea of the protocol.
boringtun = { version = "=0.7.1", default-features = false }
rand = { workspace = true }

[lints]
workspace = true
