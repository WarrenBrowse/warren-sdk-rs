# Warren SDK (Rust) workspace.
#
# Standalone client SDK for the Warren VPN. It does NOT depend on the
# warren-core monorepo: it is a clean-room reimplementation that stays
# wire-compatible with warren-core's frozen contracts (identity, SS58,
# request signing, handshake, signed relay list, NAT-PMP, multihop).
# The same exercise is meant to be repeated in TypeScript, Dart, Python,
# Kotlin, Swift and Java, so every layer is kept portable in concept and
# pinned by shared golden vectors under `vectors/`.
[workspace]
resolver = "2"
members = [
    "crates/warren-identity",
    "crates/warren-wire",
    "crates/warren-api",
    "crates/warren-discovery",
    "crates/warren-transport",
    "crates/warren-net",
    "crates/warren-bolthole-core",
    "crates/warren-bolthole",
    "crates/warren-sdk",
    "crates/warren-sdk-ffi",
    "crates/warren-headless",
    "crates/warren-proxy",
    "crates/warren-multihop",
    "crates/warren-daita",
    "crates/warren-tun",
    "crates/warren-tun-core",
    "crates/warren-test-support",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
repository = "https://github.com/WarrenBrowse/warren-sdk-rs"
authors = ["WarrenBrowse <hello@warrenbrowse.com>"]
publish = false

[workspace.dependencies]
# WarrenGuard engine crates: the generic data-plane primitives the SDK re-exports.
# Declared as GIT deps pinned to the rev in `.warrenguard-version` so the SDK is
# self-resolving as a git dependency for downstream consumers (warrend, the Dart
# FRB, the TS napi binding) that have no sibling engine checkout. Local dev and CI
# override these with the sibling `../warrenguard` via the `[patch]` at the foot of
# this file (CI's checkout-engine action clones it there at the same rev). Keep the
# rev below in lockstep with `.warrenguard-version`.
warrenguard-wire = { git = "https://github.com/WarrenBrowse/warrenguard.git", rev = "6c4ac0f2a722c2f6e390cb1f0628df5dca743a21" }
warrenguard-identity = { git = "https://github.com/WarrenBrowse/warrenguard.git", rev = "6c4ac0f2a722c2f6e390cb1f0628df5dca743a21" }
warrenguard-multihop = { git = "https://github.com/WarrenBrowse/warrenguard.git", rev = "6c4ac0f2a722c2f6e390cb1f0628df5dca743a21" }
warrenguard-daita = { git = "https://github.com/WarrenBrowse/warrenguard.git", rev = "6c4ac0f2a722c2f6e390cb1f0628df5dca743a21" }
warrenguard-tls = { git = "https://github.com/WarrenBrowse/warrenguard.git", rev = "6c4ac0f2a722c2f6e390cb1f0628df5dca743a21" }
# Opt-in TLS-over-TCP fallback carrier (anti-censorship datapath): the client
# shim + auto-activation policy `warren-transport` wraps around its UDP dial.
warrenguard-tcp-fallback = { git = "https://github.com/WarrenBrowse/warrenguard.git", rev = "6c4ac0f2a722c2f6e390cb1f0628df5dca743a21" }
warrenguard-natpmp-protocol = { git = "https://github.com/WarrenBrowse/warrenguard.git", rev = "6c4ac0f2a722c2f6e390cb1f0628df5dca743a21" }
warrenguard-tun-core = { git = "https://github.com/WarrenBrowse/warrenguard.git", rev = "6c4ac0f2a722c2f6e390cb1f0628df5dca743a21" }
warrenguard-tun-device = { git = "https://github.com/WarrenBrowse/warrenguard.git", rev = "6c4ac0f2a722c2f6e390cb1f0628df5dca743a21" }
# Single home of the per-OS carrier-socket bypass picker
# (`socket_bypass::tunnel_socket_bypass`) plus the post-incident carrier egress
# guard: the SDK's experimental TUN datapath delegates to it instead of
# re-deriving the mechanism (doc-94 B2). Privileged (pulls the OS killswitch), so
# the SDK gates it behind `experimental-tun` and it never enters the userland
# closure.
warrenguard-route-split = { git = "https://github.com/WarrenBrowse/warrenguard.git", rev = "6c4ac0f2a722c2f6e390cb1f0628df5dca743a21" }
# The OS killswitch (pf sub-anchor on macOS, nft table on Linux): the single home
# the experimental TUN datapath installs so it fails closed, replacing the deleted
# in-tree plan/apply killswitch (doc-94 B1). Privileged, so gated by experimental-tun.
warrenguard-killswitch-os = { git = "https://github.com/WarrenBrowse/warrenguard.git", rev = "6c4ac0f2a722c2f6e390cb1f0628df5dca743a21" }
warrenguard-backoff = { git = "https://github.com/WarrenBrowse/warrenguard.git", rev = "6c4ac0f2a722c2f6e390cb1f0628df5dca743a21" }
warrenguard-token = { git = "https://github.com/WarrenBrowse/warrenguard.git", rev = "6c4ac0f2a722c2f6e390cb1f0628df5dca743a21" }
# Per-OS carrier-socket bypass (SO_MARK / IP_BOUND_IF / IP_UNICAST_IF): keeps the
# QUIC socket on the physical link so the split-default TUN datapath can drop the
# `<exit_ip>/32` host route (Port Fail / TunnelCrack ServerIP fix). Consumed by
# `warren-transport`'s dialer and passed a bypass value by `warren-sdk`.
warrenguard-socket-bypass = { git = "https://github.com/WarrenBrowse/warrenguard.git", rev = "6c4ac0f2a722c2f6e390cb1f0628df5dca743a21" }
# Client-side tunnel transport: the multihop protocol logic (HPKE seal/open,
# rekey/epoch, setup-over-stream, sync datagram send/recv) lives once in
# `warrenguard_transport::multihop::MultiHopClient`; `warren-transport`'s
# MultihopSession/MultihopClientTunnel are thin wrappers around it.
warrenguard-transport = { git = "https://github.com/WarrenBrowse/warrenguard.git", rev = "6c4ac0f2a722c2f6e390cb1f0628df5dca743a21" }
# Shared engine transport core: the client transport profile
# (`warren_transport_config_client`) `warren-transport` dials with, and the
# inner-MTU budget (`inner_mtu`) `warren-net` sizes the proxy datapath from.
warrenguard-transport-core = { git = "https://github.com/WarrenBrowse/warrenguard.git", rev = "6c4ac0f2a722c2f6e390cb1f0628df5dca743a21" }
# Central knob registry: `CoverDefenses` + `cover_defenses()` resolve the coupled
# DAITA / idle-cover client switch that `warren-sdk`'s client builder threads.
warrenguard-config = { git = "https://github.com/WarrenBrowse/warrenguard.git", rev = "6c4ac0f2a722c2f6e390cb1f0628df5dca743a21" }
# Single home of the idle-cover scheduler + driver (ADR-0006): the SDK sessions
# implement its `CoverSink` and drive its `IdleCoverDriver`, replacing the former
# in-tree `warren-transport/src/idle_cover.rs` twin.
warrenguard-pump = { git = "https://github.com/WarrenBrowse/warrenguard.git", rev = "6c4ac0f2a722c2f6e390cb1f0628df5dca743a21" }

# Neutral client<->server contract (SS58, X-Warren signing, /v1 DTOs) and the
# signed-relay-list discovery core. Git-dep + rev so the SDK self-resolves for a
# downstream consumer with no sibling checkout; local dev and CI override with
# the `../warren-contract` sibling via the `[patch]` at the foot of this file.
# Keep the rev in lockstep with `.warren-contract-version`.
warren-contract = { git = "https://github.com/WarrenBrowse/warren-contract.git", rev = "7529c0fa3ec96e1f96df099f0b52a1d042a602ed" }
warren-discovery-core = { git = "https://github.com/WarrenBrowse/warren-contract.git", rev = "7529c0fa3ec96e1f96df099f0b52a1d042a602ed" }

# Identity / crypto. Leaf RustCrypto and ecosystem crates, kept minimal
# so each can be mapped 1:1 to the other language SDKs.
ed25519-dalek = { version = "2", features = ["zeroize", "rand_core"] }
bip39 = { version = "2", features = ["rand"] }
hkdf = "0.12"
sha2 = "0.10"
bs58 = "0.5"
blake2 = "0.10"
hex = "0.4"
zeroize = { version = "1", features = ["zeroize_derive"] }

# Errors. thiserror for libraries; never a stringly-typed error.
thiserror = "2"

# Observability. The SDK emits tracing events at its own migration decision
# points (escape refused, rebind failed, epoch ended) and never installs a
# subscriber: where the events go is the consumer's choice.
tracing = "0.1"

# Serialization. serde for public DTOs and golden-vector replay; postcard is
# the exact wire codec warren-core uses for the handshake frames, so the SDK
# must use it too to stay byte-compatible.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }

# Weighted random relay selection. rand 0.8 keeps rand_core 0.6, matching
# ed25519-dalek 2.x. Note the tree intentionally also carries rand_core 0.9
# (pulled by hpke 0.13 for the multihop HPKE session); the two majors coexist
# and `cargo deny` tolerates the duplicate (multiple-versions = "warn").
rand = "0.8"

# QUIC transport. quinn 0.11 with the tokio runtime and ring crypto; rustls is
# TLS-1.3-only (no tls12) with raw public keys. data-encoding provides the
# base32-DNSSEC SNI codec.
#
# The SDK builds on the warren-quinn fork (renamed crate, lib name stays `quinn`
# so `use quinn` is unchanged), the same QUIC backend as warrenguard/warren-core.
# This gives every SDK consumer the fork's GSO transmit caps and the
# obfuscated-Initial padding/fragmentation knobs, which `warren_transport_config`
# enables by default, so a Dart proxy via warren_sdk_frb presents the same QUIC
# Initial fingerprint and network quality as warren-app with zero configuration.
quinn = { git = "https://github.com/WarrenBrowse/warren-quinn.git", tag = "v0.11.16-fork.11", package = "warren-quinn" }
# No `logging` feature: rustls can emit handshake diagnostics (including the
# SNI, which encodes the exit pubkey) through the `log` facade, which would leak
# into an embedder's log sink and break Warren's no-log posture.
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
data-encoding = "2"
bytes = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }

# Test-only helpers.
tempfile = "3"

# Lints applied to every crate in the workspace via `[lints] workspace = true`.
# Mirrors warren-core's policy: zero unsafe, deny correctness, document the
# public surface.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.rustdoc]
# A broken doc link is a silent rot: deny it so a renamed symbol fails the doc
# build instead of shipping a dead reference.
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
must_use_candidate = "warn"
needless_pass_by_value = "warn"

# Release profile for this workspace's own artifacts (the FFI cdylib, examples,
# benches). It does NOT propagate to crates that depend on warren-sdk: a consumer
# governs the final binary's profile. The point here is cross-crate inlining on
# the packet datapath, which crosses the PacketSink / Connector / smoltcp-device
# trait seams between crates; without LTO those stay behind a vtable per packet.
# `target-cpu` is deliberately left at the portable default (this is a portable
# SDK). Panic strategy is left to the consuming binary (the FFI boundary handles
# unwinding via uniffi), so it is not pinned here.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Benchmarks run with production codegen (LTO + single codegen unit) so the
# numbers reflect release behavior, with debug symbols kept for profiling.
[profile.bench]
inherits = "release"
debug = true

# Local-dev / CI override: resolve the WarrenGuard engine crates from the sibling
# checkout (`../warrenguard`) instead of fetching the pinned git rev declared in
# `[workspace.dependencies]`. CI's `checkout-engine` action clones warrenguard
# there at `.warrenguard-version`; local dev has it as a sibling. This keeps the
# engine working tree the single source of truth for sibling builds, while the git
# deps make the SDK self-resolving for a downstream consumer that has no sibling
# (it simply does not inherit this patch). Mirror any add/remove in
# `[workspace.dependencies]` above.
[patch."https://github.com/WarrenBrowse/warrenguard.git"]
warrenguard-wire = { path = "../warrenguard/crates/warrenguard-wire" }
warrenguard-identity = { path = "../warrenguard/crates/warrenguard-identity" }
warrenguard-multihop = { path = "../warrenguard/crates/warrenguard-multihop" }
warrenguard-daita = { path = "../warrenguard/crates/warrenguard-daita" }
warrenguard-tls = { path = "../warrenguard/crates/warrenguard-tls" }
warrenguard-tcp-fallback = { path = "../warrenguard/crates/warrenguard-tcp-fallback" }
warrenguard-natpmp-protocol = { path = "../warrenguard/crates/warrenguard-natpmp-protocol" }
warrenguard-tun-core = { path = "../warrenguard/crates/warrenguard-tun-core" }
warrenguard-tun-device = { path = "../warrenguard/crates/warrenguard-tun-device" }
warrenguard-route-split = { path = "../warrenguard/crates/warrenguard-route-split" }
warrenguard-killswitch-os = { path = "../warrenguard/crates/warrenguard-killswitch-os" }
warrenguard-backoff = { path = "../warrenguard/crates/warrenguard-backoff" }
warrenguard-token = { path = "../warrenguard/crates/warrenguard-token" }
warrenguard-socket-bypass = { path = "../warrenguard/crates/warrenguard-socket-bypass" }
warrenguard-transport = { path = "../warrenguard/crates/warrenguard-transport" }
warrenguard-transport-core = { path = "../warrenguard/crates/warrenguard-transport-core" }
warrenguard-config = { path = "../warrenguard/crates/warrenguard-config" }
warrenguard-pump = { path = "../warrenguard/crates/warrenguard-pump" }

[patch."https://github.com/WarrenBrowse/warren-contract.git"]
warren-contract = { path = "../warren-contract" }
warren-discovery-core = { path = "../warren-contract/warren-discovery" }

# The warrenguard rev pinned above still declares the warren-quinn fork over
# ssh://, which anonymous builds cannot fetch; redirect that source to https so
# the whole graph resolves a single quinn from the anonymous-cloneable URL.
# Drop this section once warrenguard declares quinn over https and the
# .warrenguard-version pin has moved past that change.
[patch."ssh://git@github.com/WarrenBrowse/warren-quinn.git"]
quinn = { git = "https://github.com/WarrenBrowse/warren-quinn.git", tag = "v0.11.16-fork.11", package = "warren-quinn" }
quinn-udp = { git = "https://github.com/WarrenBrowse/warren-quinn.git", tag = "v0.11.16-fork.11", package = "warren-quinn-udp" }
