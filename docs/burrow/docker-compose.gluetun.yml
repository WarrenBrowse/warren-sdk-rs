# A stock gluetun through a Warren gateway, and an application that egresses
# only through gluetun.
#
# gluetun is an unmodified qmcgaw/gluetun with VPN_SERVICE_PROVIDER=custom and
# VPN_TYPE=wireguard, fed the env snippet the gateway generated. Nothing here
# is a fork, a patch or a Warren-specific gluetun setting.
#
# Bring it up: docs/burrow/README.md, "The gluetun stack", which generates the
# peer and extracts ./glue.gluetun.env before the first `up`.
#
# Restarting gluetun replaces the network namespace `app` joined: docker gives
# the restarted container a new one, and every service that joined the old one
# keeps a handle on a destroyed namespace, with no connectivity and no error,
# until it is restarted too. Compose cannot express that dependency.
name: warren-burrow-gluetun

services:
  warren-burrow:
    image: ghcr.io/warrenbrowse/warren-burrow:beta
    restart: unless-stopped
    # No cap_add, no devices, no privileged: the gateway terminates its peers
    # on a UDP socket and reaches the exit in userland. The container that gets
    # privilege here is gluetun, which owns a TUN interface.
    environment:
      # Never the phrase itself: the file is mounted as a compose secret below,
      # so it stays out of the compose file, out of `docker inspect` and out of
      # the shell history.
      WARREN_MNEMONIC_FILE: /run/secrets/warren_mnemonic
      # The one decision that exposes the ordinary WireGuard hop. Here that hop
      # is a docker network on this host, which is the intended shape.
      WARREN_BURROW_LAN: "1"
      WARREN_BURROW_LISTEN: 0.0.0.0:51820
      # What gets written into the generated client files, so it has to be the
      # address gluetun dials, not a name.
      WARREN_BURROW_ENDPOINT: 172.30.0.10:51820
      WARREN_CONNECT_TIMEOUT: "90"
      WARREN_BURROW_PEERS: "1"
      WARREN_EXITS: de, nl
    secrets:
      - warren_mnemonic
    # The gateway key, the peer configurations and the admin token live here
    # and nowhere else. Recreated without this volume, the gateway generates a
    # new key and every configuration already handed out stops working.
    volumes:
      - warren-burrow-state:/var/lib/warren-burrow
    networks:
      lab:
        ipv4_address: 172.30.0.10
    # 51820/udp is deliberately not published to the host. Warren's QUIC
    # transport and its obfuscation begin AT this gateway, so publishing that
    # port offers the one hop of the path that is recognisable WireGuard to
    # every network this host sits on. gluetun reaches it on the docker network
    # below, which needs no published port at all.
    healthcheck:
      # The image already declares this; it is repeated here because the start
      # period has to follow WARREN_CONNECT_TIMEOUT above, and because what
      # gluetun waits for should be readable in the file that makes it wait.
      test: ["CMD", "/usr/local/bin/warren-burrow", "healthcheck"]
      interval: 60s
      timeout: 15s
      start_period: 120s
      retries: 2

  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    restart: unless-stopped
    # gluetun's own startup check dials a public host seconds after it comes up
    # and restarts its VPN when that fails, so it must not start before the
    # gateway's gate is open. /healthz answers 200 only once the tunnel is
    # connected AND egress is proven for the epoch running now.
    depends_on:
      warren-burrow:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    devices:
      # gluetun falls back to userspace wireguard-go on a kernel without the
      # module, and that needs the TUN device. Harmless where the module is
      # present.
      - /dev/net/tun:/dev/net/tun
    # Generated by the gateway, extracted once, never hand-edited: it carries
    # this peer's private key and preshared key, so keep it 0600 and out of
    # version control.
    env_file:
      - ./glue.gluetun.env
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      # gluetun refuses a hostname here, and a compose service name is a
      # hostname. This is the gateway's fixed address on the network below.
      WIREGUARD_ENDPOINT_IP: "172.30.0.10"
      WIREGUARD_ENDPOINT_PORT: "51820"
      HTTPPROXY: "on"
      TZ: Europe/Paris
    networks:
      lab:
        ipv4_address: 172.30.0.20
    ports:
      # gluetun's HTTP proxy, on loopback: it is a way into the tunnel, so it
      # belongs to this host and not to the network.
      - "127.0.0.1:8888:8888/tcp"

  app:
    image: alpine:3.22
    depends_on:
      gluetun:
        condition: service_healthy
    # Joins gluetun's network namespace: no interface of its own, no route out
    # except through the tunnel, and gluetun's firewall around it.
    network_mode: "service:gluetun"
    command: ["sleep", "infinity"]

networks:
  lab:
    name: warren-burrow-lab
    ipam:
      config:
        # Fixed, because the gateway's address is written into a client
        # configuration and into gluetun's endpoint: an address docker hands
        # out in start order cannot be either.
        - subnet: 172.30.0.0/24

volumes:
  warren-burrow-state:

secrets:
  warren_mnemonic:
    # A file holding the account's recovery phrase and nothing else, 0600,
    # created next to this compose file and never committed.
    file: ./warren-mnemonic.txt
