# Windows builds of warren-sdk-rs, run on Codemagic windows_x2 machines.
#
# Nothing here triggers on its own: no webhook is installed and no workflow has
# a `triggering` section. Each build is started by a GitHub Actions job through
# .github/actions/codemagic-build (a copy of warren-app's), which passes the
# job's commit
# as `sha`, replays the step logs and publishes the verified outputs itself.
#
# Only the PowerShell checkout step comes from the ref Codemagic cloned; the
# rest runs from the requested commit. PowerShell 5.1 strips inner double
# quotes from native-command arguments, so bash only ever gets a script file.
#
# Every bash step runs under scripts/ci/codemagic/watchdog.sh, which kills a
# step that prints nothing for 5 minutes on an idle machine or for 30 minutes
# at all; scripts/ci/codemagic/test-watchdog.sh fails CI if a step escapes it.

definitions:
  pre_clone: &pre_clone
    - name: Allow long paths
      script: git config --system core.longpaths true
  checkout: &checkout
    name: Check out the requested commit
    script: |
      git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=60 fetch --no-tags --depth=1 origin $env:WARREN_SHA
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      git checkout --detach --quiet $env:WARREN_SHA
      exit $LASTEXITCODE
  # Downloads for every workflow (scripts/ci/codemagic/windows-env.sh); the
  # compiled tree is added for the CI workflow only. One cache per workflow,
  # kept 14 days; `scripts/codemagic-cache.sh clear warren-sdk-rs` in the
  # workspace empties them.
  download_cache: &download_cache
    - ~/.rustup
    - ~/.cargo/bin
    - ~/.cargo/registry
    - ~/.cargo/git
  cargo_vars: &cargo_vars
    CM_RECURSIVE_SUBMODULE_INIT: "false"
    CARGO_TERM_COLOR: always
    CARGO_INCREMENTAL: "0"

workflows:
  windows-ci:
    name: CI (windows)
    instance_type: windows_x2
    max_build_duration: 90
    inputs:
      sha:
        description: Commit to build (full SHA)
    environment:
      vars:
        <<: *cargo_vars
        RUST_BACKTRACE: "1"
        RUSTFLAGS: -D warnings
        CARGO_TARGET_DIR: C:\Users\builder\cm-target
        WARREN_SHA: ${{ inputs.sha }}
    cache:
      cache_paths:
        - ~/.rustup
        - ~/.cargo/bin
        - ~/.cargo/registry
        - ~/.cargo/git
        - ~/cm-target
    pre_clone_scripts: *pre_clone
    scripts:
      - *checkout
      - name: Toolchain, nextest and siblings
        script: |
          & 'C:\Program Files\Git\bin\bash.exe' scripts/ci/codemagic/watchdog.sh bash scripts/ci/codemagic/windows-ci.sh prepare
          exit $LASTEXITCODE
      - name: cargo clippy
        script: |
          & 'C:\Program Files\Git\bin\bash.exe' scripts/ci/codemagic/watchdog.sh bash scripts/ci/codemagic/windows-ci.sh clippy
          exit $LASTEXITCODE
      - name: cargo nextest
        script: |
          & 'C:\Program Files\Git\bin\bash.exe' scripts/ci/codemagic/watchdog.sh bash scripts/ci/codemagic/windows-ci.sh test
          exit $LASTEXITCODE

  bolthole-windows:
    name: warren-bolthole (windows-x86_64)
    instance_type: windows_x2
    max_build_duration: 90
    inputs:
      sha:
        description: Commit to build (full SHA)
      channel:
        description: Release channel
        type: choice
        options: [prod, beta]
        default: beta
      version:
        description: Release version (0.0.0-dry for a dry run)
      env_tag:
        description: Asset name suffix of the channel ("-beta" or empty)
        default: ""
    labels:
      - ${{ inputs.channel }} ${{ inputs.version }}
    environment:
      vars:
        <<: *cargo_vars
        WARREN_SHA: ${{ inputs.sha }}
        WARREN_CHANNEL: ${{ inputs.channel }}
        WARREN_VERSION: ${{ inputs.version }}
        WARREN_ENV_TAG: ${{ inputs.env_tag }}
    cache:
      cache_paths: *download_cache
    pre_clone_scripts: *pre_clone
    scripts:
      - *checkout
      - name: Toolchain and siblings
        script: |
          & 'C:\Program Files\Git\bin\bash.exe' scripts/ci/codemagic/watchdog.sh bash scripts/ci/codemagic/bolthole-windows.sh prepare
          exit $LASTEXITCODE
      - name: Build and test
        script: |
          & 'C:\Program Files\Git\bin\bash.exe' scripts/ci/codemagic/watchdog.sh bash scripts/ci/codemagic/bolthole-windows.sh build
          exit $LASTEXITCODE
      - name: Package
        script: |
          & 'C:\Program Files\Git\bin\bash.exe' scripts/ci/codemagic/watchdog.sh bash scripts/ci/codemagic/bolthole-windows.sh package
          exit $LASTEXITCODE
    artifacts:
      - cm-out/*
