name: warren_sdk
description: >-
  Dart/Flutter binding for the Warren VPN client SDK. Wraps the uniffi-generated
  bindings over the warren-sdk-ffi cdylib. The generated bindings and the loaded
  native library are produced by tool/generate.sh (see README.md); they are not
  checked in.
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  ffi: ^2.1.0

dev_dependencies:
  test: ^1.25.0
  ffigen: ^13.0.0
