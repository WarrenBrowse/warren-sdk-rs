# cargo-deny policy. Keeps the dependency tree auditable: the same SDK is
# reimplemented in many languages, so the Rust dependency set must stay
# small, maintained, and license-clean.

[advisories]
version = 2
yanked = "deny"
# RUSTSEC ignores are limited to UNMAINTAINED advisories on transitive deps whose
# code is frozen and not attacker-reachable in a way that matters here.
ignore = [
    # bincode 1.3.3: flagged unmaintained by RUSTSEC-2025-0141 after the upstream
    # team permanently ceased development, explicitly declaring 1.3.3 "a complete
    # version of bincode that is not in need of any updates". It is pulled only
    # transitively by maybenot 2.2.2 / maybenot-machines 1.0.1 (the DAITA defense
    # framework), which use it to (de)serialize curated machine specs we generate
    # ourselves, never attacker-controlled bytes. warren-core ignores the same
    # advisory for the same reason. Removing this requires maybenot to migrate off
    # bincode; track upstream.
    "RUSTSEC-2025-0141",
    # atomic-polyfill: unmaintained, pulled transitively via the engine smoltcp/heapless
    # netstack deps. Security-clean (no CVE). warren-core ignores the same.
    "RUSTSEC-2023-0089",
]

[licenses]
version = 2
# Permissive licenses plus GPL-3.0 (the project baseline). Add an entry
# only after reviewing the dependency that needs it.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "AGPL-3.0-or-later",
    # Public-domain dedication used by the bip39 dependency tree (bip39,
    # bitcoin_hashes, hex-conservative).
    "CC0-1.0",
    # Mozilla CA bundle (webpki-roots) pulled by the reqwest transport.
    "CDLA-Permissive-2.0",
    "Zlib",
    # Public-domain-equivalent license of smoltcp (userspace netstack).
    "0BSD",
    # uniffi and its codegen dependency tree (Mozilla), the FFI binding layer.
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal workspace crates are referenced by `path` without a version; that is
# not a real wildcard-version risk, so allow it.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
