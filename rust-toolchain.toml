[toolchain]
# Pinned for reproducible builds. The floor is set by smoltcp 0.14, the first
# release whose TCP congestion window bounds the data in flight (rust-version
# 1.91); warren-core stays on 1.89 and does not compile this datapath. The wire
# contracts (BIP39, HKDF, ed25519-dalek 2.x) are pinned by Cargo.lock, not by
# the toolchain, so the frozen golden vectors are unaffected by this bump.
channel = "1.91.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
