name: CI

# Runs exclusively on the WarrenBrowse self-hosted runners; the label sets
# below are matched against the live fleet. Verification jobs run on the
# NATIVE arm64 Linux runners: x86-under-emulation containers can wedge
# cargo/nextest when rustc dies unreaped (zombie jobserver deadlock). Only
# jobs that must PRODUCE x86_64 artifacts belong on the emulation runners;
# this workflow has none.
# Do not switch any job to a GitHub-hosted runner.
#
# No dependency-cache action here, and adding one back breaks other jobs. Two
# runner instances share one host and therefore one CARGO_HOME, and
# Swatinem/rust-cache's post step CLEANS that directory: on 2026-08-16 the
# macOS clippy job logged "Cleaning cargo registry" then "Cleaning cargo/bin"
# at 16:39:55Z, and the macOS test job on the sibling instance died ten seconds
# later with `rustc ... (never executed): No such file or directory (os error
# 2)`, then `could not parse/generate dep info`, then `cargo: command not
# found`. That is the spawn flake that cost a rerun on nearly every push for two
# days. These runners are persistent, so their CARGO_HOME is already warm and
# the action bought nothing; its own saves were colliding anyway ("Unable to
# reserve cache with key ..., another job").

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

concurrency:
  # A single self-hosted Linux runner serves these jobs; cancel superseded runs
  # on the same ref so a burst of pushes cannot pile up a long serial backlog.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: cargo fmt
    runs-on: [self-hosted, Linux, ARM64, macstudio-arm64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # CI clones the siblings at the .version files and [patch]es to them, so
      # a Cargo.toml git rev that diverges from its .version file would ship a
      # declared dependency nobody tested. Fail closed on any mismatch.
      - name: check engine + contract pin lockstep
        run: |
          set -euo pipefail
          check_pin() {
            local host="$1" file="$2" rev mismatch
            rev="$(tr -d '[:space:]' < "${file}")"
            mismatch="$(grep -E "${host}.*\brev = \"" Cargo.toml | grep -v "rev = \"${rev}\"" || true)"
            if [ -n "${mismatch}" ]; then
              echo "Cargo.toml rev diverges from ${file} (${rev}):"
              echo "${mismatch}"
              exit 1
            fi
          }
          check_pin 'warrenguard\.git' .warrenguard-version
          check_pin 'warren-contract\.git' .warren-contract-version
      - uses: ./.github/actions/checkout-engine
        with:
          token: ${{ secrets.ENGINE_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  anti-refrag:
    name: anti-refragmentation gate
    runs-on: [self-hosted, Linux, ARM64, macstudio-arm64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Siblings present so the offline `cargo metadata --no-deps` dependency-
      # direction assertion resolves the patched path deps; the grep rules need
      # no siblings and run regardless.
      - uses: ./.github/actions/checkout-engine
        with:
          token: ${{ secrets.ENGINE_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: single-home twin detector
        run: bash scripts/ci/anti-refrag.sh

  clippy:
    name: cargo clippy (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: [self-hosted, Linux, ARM64, macstudio-arm64]
          - name: windows
            runner: [self-hosted, Windows, macstudio-win]
          - name: macos
            runner: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-engine
        with:
          token: ${{ secrets.ENGINE_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy
      # --locked refuses to mutate Cargo.lock (CI reproducibility: the frozen
      # golden vectors must resolve against the exact transitive crates).
      # --all-features also lints the privileged per-OS datapath behind the
      # `tun`/`killswitch` features on each native runner (today empty, so this
      # is a no-op that is already in place when those back ends land).
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: cargo test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: [self-hosted, Linux, ARM64, macstudio-arm64]
          - name: windows
            runner: [self-hosted, Windows, macstudio-win]
          - name: macos
            runner: [self-hosted, macOS, ARM64]
    steps:
      # The test binaries read the golden vectors submodule (warren-vectors)
      # at runtime, so this job checks it out; VECTORS_TOKEN grants read
      # access to it.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.VECTORS_TOKEN }}
      - uses: ./.github/actions/checkout-engine
        with:
          token: ${{ secrets.ENGINE_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Two different retries, because they cover two different failures.
      # nextest --retries 2 re-runs a TEST that ran and failed: the in-process
      # quinn loopback tunnel tests can hit a quinn Drop/UDP-bind race on
      # slower runners. The wrapper re-runs the whole command when cargo could
      # not SPAWN rustc for a dependency, which happens before any test exists
      # and which nextest therefore never sees; the classifier fails a real
      # compile, lint or test failure on the first attempt
      # (scripts/ci/run-with-runner-retry.sh). The test job is the correctness
      # gate; real exit validation is manual against warren-core (cf. CLAUDE.md).
      - name: run the test suite
        run: >
          bash scripts/ci/run-with-runner-retry.sh
          cargo nextest run --locked --workspace --all-targets --all-features --retries 2

  shell-gates:
    name: shell gates
    # The shell that CI and the release pipeline run has no compiler to catch
    # it, so what it decides is pinned by tests of its own.
    runs-on: [self-hosted, Linux, ARM64, macstudio-arm64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: runner-retry classifier tests
        run: bash scripts/ci/test-run-with-runner-retry.sh
      # The compose examples are copy-paste templates: whatever they get wrong,
      # users deploy. Nothing else in this repo reads them.
      - name: deployment example tests
        run: sh docs/bolthole/test-examples.sh

  bindings:
    name: uniffi bindings
    runs-on: [self-hosted, Linux, ARM64, macstudio-arm64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-engine
        with:
          token: ${{ secrets.ENGINE_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.89.0
      # Build the cdylib and generate foreign bindings from it. This fails if the
      # uniffi scaffolding or any exported type/function regresses. --no-format
      # avoids a dependency on ktlint/swiftformat on the runner.
      - run: cargo build -p warren-sdk-ffi --locked
      - run: >
          cargo run -p warren-sdk-ffi --bin uniffi-bindgen -- generate
          --library target/debug/libwarren_sdk_ffi.so
          --language python --language kotlin
          --no-format --out-dir target/bindings
      - name: assert exported surface is present
        run: |
          grep -q "def generate_identity" target/bindings/warren_sdk_ffi.py
          grep -q "def sign_request" target/bindings/warren_sdk_ffi.py
          grep -q "class WarrenFfiClient" target/bindings/warren_sdk_ffi.py
          grep -q "def with_multihop_roots" target/bindings/warren_sdk_ffi.py
          grep -q "def with_persistence" target/bindings/warren_sdk_ffi.py
          grep -q "def with_options" target/bindings/warren_sdk_ffi.py
          grep -q "class FfiClientOptions" target/bindings/warren_sdk_ffi.py
          grep -q "class FfiProxyOptions" target/bindings/warren_sdk_ffi.py
          grep -q "async def subscription_expiry" target/bindings/warren_sdk_ffi.py
          grep -q "async def fetch_multihop_exits" target/bindings/warren_sdk_ffi.py
          grep -q "class FfiExit" target/bindings/warren_sdk_ffi.py
          grep -q "class WarrenFfiProxy" target/bindings/warren_sdk_ffi.py
          grep -q "async def start_proxy" target/bindings/warren_sdk_ffi.py
          grep -q "async def start_proxy_supervised" target/bindings/warren_sdk_ffi.py
          grep -q "async def start_proxy_supervised_failover" target/bindings/warren_sdk_ffi.py
          grep -q "async def redeem_voucher" target/bindings/warren_sdk_ffi.py
          grep -q "class FfiConnectionState" target/bindings/warren_sdk_ffi.py
          grep -q "class ConnectionObserver" target/bindings/warren_sdk_ffi.py
          grep -q "class FfiMapProto" target/bindings/warren_sdk_ffi.py
          grep -q "class WarrenFfiForwardedPort" target/bindings/warren_sdk_ffi.py
          grep -q "class WarrenFfiSupervisedProxy" target/bindings/warren_sdk_ffi.py
          grep -q "async def forward_port" target/bindings/warren_sdk_ffi.py
          grep -q "async def delete_account" target/bindings/warren_sdk_ffi.py

  deny:
    name: cargo-deny
    runs-on: [self-hosted, Linux, ARM64, macstudio-arm64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Install and run directly rather than the container action: the Linux
      # runners are not guaranteed to expose a usable Docker daemon to jobs.
      - uses: ./.github/actions/checkout-engine
        with:
          token: ${{ secrets.ENGINE_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # cargo-deny evaluates the default feature set: a dependency reachable
      # only behind an optional feature escapes this gate entirely, which is
      # why the workspace declares its shipped dependencies plainly.
      - run: cargo deny check

  coverage:
    name: cargo llvm-cov
    # Native ARM64 Linux, NOT the x86 Rosetta runner: `-C instrument-coverage`
    # intermittently SIGSEGVs rustc under Rosetta emulation (the plain
    # test/clippy builds are un-instrumented and fine; only the coverage build
    # crashes). Native ARM avoids the emulation entirely.
    runs-on: [self-hosted, Linux, ARM64, macstudio-arm64]
    timeout-minutes: 30
    steps:
      # Coverage runs the test suite, which reads the golden vectors submodule.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.VECTORS_TOKEN }}
      - uses: ./.github/actions/checkout-engine
        with:
          token: ${{ secrets.ENGINE_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: llvm-tools-preview
      - name: install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: measure coverage
        # Run coverage THROUGH nextest so the same retry policy as the cargo-test
        # job (--retries 2) absorbs the in-process quinn / DNS loopback timing
        # flakes. Plain `cargo llvm-cov` has no retries and turns those transient
        # timeouts into hard coverage failures.
        run: cargo llvm-cov nextest --workspace --locked --summary-only --retries 2

  bolthole-slow:
    name: bolthole-core slow lane
    # The two kinds of test the default lane must not carry: one that sleeps
    # through boringtun's own monotonic clock (twenty seconds of real time,
    # which was the whole crate's test duration), and the datapath measurement
    # that only means anything against an optimised build. Both are `#[ignore]`d
    # so `cargo test` and the coverage run stay fast, and both still run on
    # every push, here.
    runs-on: [self-hosted, Linux, ARM64, macstudio-arm64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-engine
        with:
          token: ${{ secrets.ENGINE_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.89.0
      # One thread, and no absolute packets-per-second floor here: these runners
      # are shared and measure a third of an idle machine, so the datapath case
      # asserts ratios between its own measurements instead. The design's
      # absolute floor is produced deliberately, with
      # WARREN_BOLTHOLE_BENCH_FLOOR=1 on a quiet machine.
      - run: >
          cargo test --locked --release -p warren-bolthole-core --
          --ignored --nocapture --test-threads=1
