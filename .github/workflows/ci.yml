name: CI

# Runs exclusively on the WarrenBrowse org self-hosted runners (Default runner
# group, visibility: all). Label sets are matched against the live runners:
#   [self-hosted, Linux, X64]    -> macstudio-linux-rosetta / warren-docker-ci
#   [self-hosted, Windows, X64]  -> win-runner1
#   [self-hosted, macOS, ARM64]  -> axiomStudio
# Do not switch any job to a GitHub-hosted runner.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: cargo fmt
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: [self-hosted, Linux, X64]
          - name: windows
            runner: [self-hosted, Windows, X64]
          - name: macos
            runner: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --locked refuses to mutate Cargo.lock (CI reproducibility: the frozen
      # golden vectors must resolve against the exact transitive crates).
      # --all-features also lints the privileged per-OS datapath behind the
      # `tun`/`killswitch` features on each native runner (today empty, so this
      # is a no-op that is already in place when those back ends land).
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: cargo test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: [self-hosted, Linux, X64]
          - name: windows
            runner: [self-hosted, Windows, X64]
          - name: macos
            runner: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # nextest retries flaky tests up to 2 times: the in-process quinn
      # loopback tunnel tests can hit a quinn Drop/UDP-bind race on slower
      # runners. The test job is the correctness gate; real exit validation
      # is manual against warren-core (cf. CLAUDE.md).
      - run: cargo nextest run --locked --workspace --all-targets --all-features --retries 2

  bindings:
    name: uniffi bindings
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      # Build the cdylib and generate foreign bindings from it. This fails if the
      # uniffi scaffolding or any exported type/function regresses. --no-format
      # avoids a dependency on ktlint/swiftformat on the runner.
      - run: cargo build -p warren-sdk-ffi --locked
      - run: >
          cargo run -p warren-sdk-ffi --bin uniffi-bindgen -- generate
          --library target/debug/libwarren_sdk_ffi.so
          --language python --language kotlin
          --no-format --out-dir target/bindings
      - name: assert exported surface is present
        run: |
          grep -q "def generate_identity" target/bindings/warren_sdk_ffi.py
          grep -q "def sign_request" target/bindings/warren_sdk_ffi.py
          grep -q "class WarrenFfiClient" target/bindings/warren_sdk_ffi.py
          grep -q "async def subscription_expiry" target/bindings/warren_sdk_ffi.py
          grep -q "async def fetch_multihop_exits" target/bindings/warren_sdk_ffi.py
          grep -q "class FfiExit" target/bindings/warren_sdk_ffi.py
          grep -q "class WarrenFfiProxy" target/bindings/warren_sdk_ffi.py
          grep -q "async def start_proxy" target/bindings/warren_sdk_ffi.py
          grep -q "async def redeem_voucher" target/bindings/warren_sdk_ffi.py
          grep -q "class FfiConnectionState" target/bindings/warren_sdk_ffi.py
          grep -q "class ConnectionObserver" target/bindings/warren_sdk_ffi.py

  deny:
    name: cargo-deny
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      # Install and run directly rather than the container action: the Linux
      # runners are not guaranteed to expose a usable Docker daemon to jobs.
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # cargo-deny evaluates the full dependency graph (all features, all target
      # cfgs) by default, so feature-gated deps behind `tun`/`killswitch` are
      # already in the license/advisory graph once they are declared.
      - run: cargo deny check

  coverage:
    name: cargo llvm-cov
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: measure coverage
        run: cargo llvm-cov --workspace --locked --summary-only
