# Release pipeline for the warren-proxy binary and its container image.
#
# Tag shapes (shared release-channel contract: one run publishes one channel):
#   proxy-vX.Y.Z       prod  -> assets warren-proxy-<ver>-...,      image :<ver> + :latest
#   proxy-beta-vX.Y.Z  beta  -> assets warren-proxy-beta-<ver>-..., image :beta-<ver> + :beta
#
# Artifacts: static musl binaries for linux x86_64 (built on the Rosetta
# docker pool, the proven warren-core musl recipe) and linux aarch64 (native
# arm64 pool), a published GitHub release with SHA256SUMS, and the multi-arch
# image ghcr.io/warrenbrowse/warren-proxy.
#
# A tag publishes only when its commit is on main and that commit already has a
# green CI run, so the release inherits the four gates.
#
# workflow_dispatch builds the binaries as run artifacts without publishing
# anything (a dry run of the matrix).

name: release-proxy

on:
  push:
    tags:
      - "proxy-v*"
      - "proxy-beta-v*"
  workflow_dispatch:
    inputs:
      channel:
        description: "prod | beta (dry run: build only, no publish)"
        required: false
        default: "beta"

permissions:
  # actions: read is what lets the resolve gate below read this commit's CI run.
  actions: read
  contents: write
  packages: write

# One publish per ref at a time: two runs of the same tag would race on the
# GHCR tags and on `gh release create`. Never cancels a run in flight, which
# would leave a half-published release behind.
concurrency:
  group: release-proxy-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  resolve:
    name: Resolve channel and version
    runs-on: [self-hosted, Linux, ARM64, macstudio-arm64]
    timeout-minutes: 10
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      version: ${{ steps.resolve.outputs.version }}
      env_tag: ${{ steps.resolve.outputs.env_tag }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: resolve
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            case "$REF_NAME" in
              proxy-beta-v*) channel=beta; prefix="proxy-beta-v"; version="${REF_NAME#proxy-beta-v}" ;;
              proxy-v*)      channel=prod; prefix="proxy-v";      version="${REF_NAME#proxy-v}" ;;
              *) echo "unexpected tag $REF_NAME" >&2; exit 1 ;;
            esac
            # The version `--version` prints is this crate's manifest version,
            # so a tag that disagrees with it ships a binary that misnames the
            # release it came from.
            manifest=$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && $1=="version"{gsub(/"/,"",$3); print $3; exit}' crates/warren-proxy/Cargo.toml)
            if [ "$manifest" != "$version" ]; then
              echo "refusing ${REF_NAME}: crates/warren-proxy/Cargo.toml says $manifest" >&2
              exit 1
            fi
            # Version-truth guard (shared git-commits rule): refuse a tag that
            # is not the strictly highest of ITS OWN series, reading the
            # remote's tags rather than the clone's. Exempt on a re-run of this
            # same run: the publish job goes to the trouble of being idempotent
            # so a partial publish can be finished, and by the time somebody
            # re-runs it the next tag of the series may already exist, which
            # would otherwise close the recovery path this pipeline built in.
            if [ "${RUN_ATTEMPT:-1}" = "1" ]; then
              highest=$(git ls-remote --tags origin "refs/tags/${prefix}*" \
                | sed "s|.*refs/tags/${prefix}||" | grep -v '\^{}' | sort -V | tail -1)
              if [ "$highest" != "$version" ]; then
                echo "refusing ${REF_NAME}: highest ${prefix}* on origin is ${prefix}${highest}" >&2
                exit 1
              fi
            else
              echo "attempt ${RUN_ATTEMPT} of ${REF_NAME}: recovery re-run, not checking it is the highest ${prefix}*"
            fi
            # A tag can be cut on any commit, so the release inherits the four
            # gates instead of re-running one of them: the tagged commit has to
            # be on main and to carry a CI run that concluded success.
            git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "refusing ${REF_NAME}: its commit is not on main" >&2
              exit 1
            fi
            runs=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=1") \
              || { echo "refusing ${REF_NAME}: the workflow-runs API is unreadable" >&2; exit 1; }
            # total_count is the first field of the response, and jq is not on
            # every runner pool.
            green=$(printf '%s' "$runs" | tr -d ' \n' | sed -nE 's/^\{"total_count":([0-9]+).*/\1/p')
            if [ "${green:-0}" -lt 1 ]; then
              echo "refusing ${REF_NAME}: no successful CI run on its commit; wait for CI, then re-run this workflow" >&2
              exit 1
            fi
            publish=true
          else
            channel="${INPUT_CHANNEL:-beta}"
            version="0.0.0-dry"
            publish=false
          fi
          env_tag=""
          [ "$channel" = "beta" ] && env_tag="-beta"
          {
            echo "channel=$channel"
            echo "version=$version"
            echo "env_tag=$env_tag"
            echo "publish=$publish"
          } >>"$GITHUB_OUTPUT"
          echo "building $channel $version (publish=$publish)"

  build:
    name: Build ${{ matrix.arch }}-musl
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            runner: [self-hosted, linux, x64, docker, warren]
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            runner: [self-hosted, Linux, ARM64, macstudio-arm64]
    runs-on: ${{ matrix.runner }}
    # Sized so the retry wrapper always outlives its own worst case and the
    # failure carries its diagnosis rather than GitHub's: two invocations
    # (build, test), each allowed two attempts of the 70-minute wedge timeout
    # plus a 15-second back-off, is 280 minutes. A lane reaches that only when
    # the runner is wedged four times over; the emulated x86_64 lane's real
    # cold build of the sibling gateway binary was 43 minutes.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-engine
        with:
          token: ${{ secrets.ENGINE_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        run: |
          set -euo pipefail
          if ! command -v musl-gcc >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends musl-tools
          fi
      - name: Build static binary
        env:
          WARREN_PRODUCT_ENV: ${{ needs.resolve.outputs.channel }}
          CARGO_TARGET: ${{ matrix.target }}
          # musl-gcc builds the C bits (ring). Both vars are target-scoped,
          # so the one not matching this matrix leg is inert.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          set -euo pipefail
          # Persistent cache outside _work (the runner GC wipes leaf target/
          # dirs in _work between jobs), one directory per target: a shared one
          # lets the retry wrapper's `cargo clean` wipe a sibling lane's tree
          # mid-build wherever two lanes land on the same host, and serialises
          # them on one cargo lock.
          export CARGO_TARGET_DIR="$HOME/warren-sdk-target-$CARGO_TARGET"
          BIN="$CARGO_TARGET_DIR/$CARGO_TARGET/release/warren-proxy"
          # That cache is deliberately persistent, so the previous run's binary
          # is sitting at $BIN: remove it, and no failure downstream can package
          # a binary that was not compiled from this tag.
          rm -f "$BIN"
          # A rustc that cannot be SPAWNED, one killed mid-compile, and a
          # wedged cargo are the three runner failures this pipeline sees; the
          # classifier retries those and fails anything else on the first
          # attempt (scripts/ci/run-with-runner-retry.sh), which also backs off
          # before retrying into the window it was trying to escape.
          #
          # 70m, not 40m: the emulated x86_64 pool needed 43 minutes for the
          # sibling gateway's cold build and a 40-minute limit killed it one
          # minute short. Two attempts, not three, because a retry here can
          # cost a full wedge timeout and three would put this job's ceiling
          # out of reach of any reasonable number.
          cargo_ci() {
            WARREN_RETRY_ATTEMPTS=2 \
              bash scripts/ci/run-with-runner-retry.sh timeout -k 60s 70m "$@"
          }
          cargo_ci cargo build --locked --release -p warren-proxy --target "$CARGO_TARGET"
          # A tag can be cut on any commit, so nothing else in this pipeline
          # guarantees the code being packaged passed its tests. Release profile
          # and same target as the build above, so it reuses what was just
          # compiled instead of building a second time.
          cargo_ci cargo test --locked --release -p warren-proxy --target "$CARGO_TARGET"
          if [ ! -x "$BIN" ]; then
            echo "cargo reported success but produced no binary at $BIN"; exit 1
          fi
          # ldd is the dynamic loader, not a static check: the musl one answers
          # a valid static binary with `Not a valid dynamic program`, which
          # matches neither accepted string and fails the release. What tells
          # the three shapes apart is the NEEDED entry, absent from a plain
          # static binary and from a static-pie, present in a dynamic one.
          if command -v readelf > /dev/null 2>&1; then
            if readelf -d "$BIN" | grep -q NEEDED; then
              echo "binary is dynamically linked:"; readelf -d "$BIN"; exit 1
            fi
          elif command -v file > /dev/null 2>&1; then
            file -b "$BIN" | grep -qE 'static-pie linked|statically linked' || {
              echo "binary is not static: $(file -b "$BIN")"; exit 1
            }
          else
            echo "no readelf and no file on this runner: cannot verify the binary is static"; exit 1
          fi
          mkdir -p dist
          cp "$BIN" dist/warren-proxy
      - uses: actions/upload-artifact@v4
        with:
          name: warren-proxy-${{ matrix.arch }}
          path: dist/warren-proxy
          if-no-files-found: error

  publish:
    name: Publish release and image
    needs: [resolve, build]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: [self-hosted, linux, x64, docker, warren]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: warren-proxy-x86_64
          path: dist/amd64
      - uses: actions/download-artifact@v4
        with:
          name: warren-proxy-aarch64
          path: dist/arm64
      - name: Package release assets
        id: package
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          ENV_TAG: ${{ needs.resolve.outputs.env_tag }}
        run: |
          set -euo pipefail
          mkdir -p out
          for pair in "amd64 x86_64" "arm64 aarch64"; do
            set -- $pair
            chmod 755 "dist/$1/warren-proxy"
            name="warren-proxy${ENV_TAG}-${VERSION}-linux-$2-musl"
            tar -C "dist/$1" -czf "out/${name}.tar.gz" warren-proxy
          done
          # No `./` prefix: `sha256sum -c` is run from wherever the assets were
          # downloaded, and the prefix makes every entry a path that has to match.
          (cd out && sha256sum -- *.tar.gz > SHA256SUMS)
          ls -l out
      # The image is pushed BEFORE the release is created. A release is the
      # announcement, and its notes point at the image: publishing it first and
      # then failing on the push (a transient GHCR denial, a QEMU/buildx setup
      # failure) left a visible release whose image 404s, and the rerun could
      # not recover it because `gh release create` refuses an existing tag.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        # The arm64 layer of the image runs `apk add` under emulation on this
        # x64 docker pool.
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push multi-arch image
        env:
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          VERSION: ${{ needs.resolve.outputs.version }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = "beta" ]; then
            tags="-t ghcr.io/warrenbrowse/warren-proxy:beta-${VERSION} -t ghcr.io/warrenbrowse/warren-proxy:beta"
          else
            tags="-t ghcr.io/warrenbrowse/warren-proxy:${VERSION} -t ghcr.io/warrenbrowse/warren-proxy:latest"
          fi
          push_image() {
            docker buildx build --push --platform linux/amd64,linux/arm64 \
              -f docker/warren-proxy.Dockerfile $tags .
          }
          # GHCR's token exchange occasionally answers `denied` on the push
          # (transient, documented in warren-core's docker.yml); a fresh login
          # and one retry clears it. A real build error fails twice.
          if ! push_image; then
            echo "::warning::image push failed, re-logging in to GHCR and retrying once"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            push_image
          fi
      - name: Create published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          prerelease=""
          [ "$CHANNEL" = "beta" ] && prerelease="--prerelease"
          # Idempotent: a rerun after a partial publish re-uploads the assets
          # instead of dying on "a release with that tag already exists".
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" out/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "warren-proxy ${CHANNEL} ${VERSION}" \
              --notes "Static musl builds of the headless warren-proxy daemon (${CHANNEL} channel). See crates/warren-proxy/README.md for the env contract." \
              $prerelease
          fi
      - name: Check the image is reachable without a GitHub account
        env:
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -uo pipefail
          image=warrenbrowse/warren-proxy
          if [ "$CHANNEL" = "beta" ]; then ref="beta-${VERSION}"; else ref="${VERSION}"; fi
          # A GHCR package is created private, and no REST endpoint flips it:
          # the only way is the package settings page. So the release says so
          # itself rather than leaving every documented `docker run` broken for
          # everyone outside the org until somebody notices.
          token=$(curl -fsSL "https://ghcr.io/token?scope=repository:${image}:pull&service=ghcr.io" \
            | sed -nE 's/.*"token":"([^"]+)".*/\1/p') || token=""
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/${image}/manifests/${ref}")
          if [ "$code" = "200" ]; then
            echo "anonymous pull of ghcr.io/${image}:${ref} answers 200"
          else
            msg="ghcr.io/${image} is not public (anonymous manifest read answered ${code}), so every documented docker run and compose file fails for anyone outside the org. Fix: https://github.com/orgs/WarrenBrowse/packages/container/warren-proxy/settings, Danger Zone, Change visibility, Public."
            echo "::warning::${msg}"
            echo "$msg" >>"$GITHUB_STEP_SUMMARY"
          fi
