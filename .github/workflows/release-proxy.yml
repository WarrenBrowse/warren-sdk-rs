# Release pipeline for the warren-proxy binary and its container image.
#
# Tag shapes (shared release-channel contract: one run publishes one channel):
#   proxy-vX.Y.Z       prod  -> assets warren-proxy-<ver>-...,      image :<ver> + :latest
#   proxy-beta-vX.Y.Z  beta  -> assets warren-proxy-beta-<ver>-..., image :beta-<ver> + :beta
#
# Artifacts: static musl binaries for linux x86_64 and aarch64, native binaries
# for macOS arm64, macOS x86_64 and Windows x86_64, a published GitHub release
# with SHA256SUMS, and the multi-arch image ghcr.io/warrenbrowse/warren-proxy.
# The Linux, Windows and publish jobs run on GitHub-hosted runners (aarch64
# natively on ubuntu-24.04-arm), the macOS lanes on the self-hosted macOS
# runners.
#
# A tag publishes only when its commit is on main and that commit already has a
# green CI run, so the release inherits the four gates.
#
# workflow_dispatch builds and packages every lane as run artifacts without
# publishing anything (a dry run of the matrix).
#
# The static check is `readelf -d` (no NEEDED entry), never `ldd`: ldd is the
# dynamic loader, and the musl one answers a valid static binary with
# `Not a valid dynamic program`, which reads as a failure. A static-pie has a
# dynamic section but no NEEDED entry, a plain static binary has no dynamic
# section at all, and a dynamically linked one lists NEEDED, so the NEEDED test
# tells the three apart wherever the check runs.

name: release-proxy

on:
  push:
    tags:
      - "proxy-v*"
      - "proxy-beta-v*"
  workflow_dispatch:
    inputs:
      channel:
        description: "prod | beta (dry run: build only, no publish)"
        required: false
        default: "beta"

permissions:
  # actions: read is what lets the resolve gate below read this commit's CI run.
  actions: read
  contents: write
  packages: write

# One publish per ref at a time: two runs of the same tag would race on the
# GHCR tags and on `gh release create`. Never cancels a run in flight, which
# would leave a half-published release behind.
concurrency:
  group: release-proxy-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  resolve:
    name: Resolve channel and version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      version: ${{ steps.resolve.outputs.version }}
      env_tag: ${{ steps.resolve.outputs.env_tag }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: resolve
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            case "$REF_NAME" in
              proxy-beta-v*) channel=beta; prefix="proxy-beta-v"; version="${REF_NAME#proxy-beta-v}" ;;
              proxy-v*)      channel=prod; prefix="proxy-v";      version="${REF_NAME#proxy-v}" ;;
              *) echo "unexpected tag $REF_NAME" >&2; exit 1 ;;
            esac
            # The version `--version` prints is this crate's manifest version,
            # so a tag that disagrees with it ships a binary that misnames the
            # release it came from.
            manifest=$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && $1=="version"{gsub(/"/,"",$3); print $3; exit}' crates/warren-proxy/Cargo.toml)
            if [ "$manifest" != "$version" ]; then
              echo "refusing ${REF_NAME}: crates/warren-proxy/Cargo.toml says $manifest" >&2
              exit 1
            fi
            # Version-truth guard (shared git-commits rule): refuse a tag that
            # is not the strictly highest of ITS OWN series, reading the
            # remote's tags rather than the clone's. Exempt on a re-run of this
            # same run: the publish job goes to the trouble of being idempotent
            # so a partial publish can be finished, and by the time somebody
            # re-runs it the next tag of the series may already exist, which
            # would otherwise close the recovery path this pipeline built in.
            if [ "${RUN_ATTEMPT:-1}" = "1" ]; then
              highest=$(git ls-remote --tags origin "refs/tags/${prefix}*" \
                | sed "s|.*refs/tags/${prefix}||" | grep -v '\^{}' | sort -V | tail -1)
              if [ "$highest" != "$version" ]; then
                echo "refusing ${REF_NAME}: highest ${prefix}* on origin is ${prefix}${highest}" >&2
                exit 1
              fi
            else
              echo "attempt ${RUN_ATTEMPT} of ${REF_NAME}: recovery re-run, not checking it is the highest ${prefix}*"
            fi
            # A tag can be cut on any commit, so the release inherits the four
            # gates instead of re-running one of them: the tagged commit has to
            # be on main and to carry a CI run that concluded success.
            git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "refusing ${REF_NAME}: its commit is not on main" >&2
              exit 1
            fi
            runs=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=1") \
              || { echo "refusing ${REF_NAME}: the workflow-runs API is unreadable" >&2; exit 1; }
            # total_count is the first field of the response; parsed without
            # jq so the gate depends on nothing but the shell.
            green=$(printf '%s' "$runs" | tr -d ' \n' | sed -nE 's/^\{"total_count":([0-9]+).*/\1/p')
            if [ "${green:-0}" -lt 1 ]; then
              echo "refusing ${REF_NAME}: no successful CI run on its commit; wait for CI, then re-run this workflow" >&2
              exit 1
            fi
            publish=true
          else
            channel="${INPUT_CHANNEL:-beta}"
            version="0.0.0-dry"
            publish=false
          fi
          env_tag=""
          [ "$channel" = "beta" ] && env_tag="-beta"
          {
            echo "channel=$channel"
            echo "version=$version"
            echo "env_tag=$env_tag"
            echo "publish=$publish"
          } >>"$GITHUB_OUTPUT"
          echo "building $channel $version (publish=$publish)"

  build:
    name: Build ${{ matrix.lane }}
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: linux-x86_64-musl
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            asset_os: linux-x86_64-musl
            # A wedged cargo prints nothing and waits forever; `timeout` is the
            # only thing that ends it. Sized off the emulated self-hosted pool
            # these lanes used to run on (a 43-minute cold build of the sibling
            # gateway); a hosted runner builds natively in minutes, so the
            # limit only ever fires on a real wedge. GNU coreutils is a
            # Linux-lane assumption: macOS has no `timeout`.
            wedge_timeout: 70m
          - lane: linux-aarch64-musl
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            asset_os: linux-aarch64-musl
            wedge_timeout: 70m
          - lane: macos-aarch64
            target: aarch64-apple-darwin
            runner: [self-hosted, macOS, ARM64]
            asset_os: macos-aarch64
            wedge_timeout: ""
          - lane: macos-x86_64
            target: x86_64-apple-darwin
            runner: [self-hosted, macOS, ARM64]
            asset_os: macos-x86_64
            wedge_timeout: ""
    runs-on: ${{ matrix.runner }}
    # Sized so the retry wrapper always outlives its own worst case and the
    # failure carries its diagnosis rather than GitHub's: two invocations
    # (build, test), each allowed two attempts of the 70-minute wedge timeout
    # plus a 15-second back-off, is 280 minutes. A lane reaches that only when
    # the runner is wedged four times over.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-engine
        with:
          token: ${{ secrets.ENGINE_TOKEN }}
      # The version rust-toolchain.toml pins: that file overrides whatever
      # toolchain this step makes the default, so the target has to be added
      # to the pinned one.
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v musl-gcc >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends musl-tools
          fi
      - name: Build, test and package
        shell: bash
        env:
          WARREN_PRODUCT_ENV: ${{ needs.resolve.outputs.channel }}
          CARGO_TARGET: ${{ matrix.target }}
          ASSET_OS: ${{ matrix.asset_os }}
          WEDGE_TIMEOUT: ${{ matrix.wedge_timeout }}
          VERSION: ${{ needs.resolve.outputs.version }}
          ENV_TAG: ${{ needs.resolve.outputs.env_tag }}
          # musl-gcc builds the C bits (ring). Both vars are target-scoped,
          # so the one not matching this matrix leg is inert.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          set -euo pipefail
          # Every lane compiles into a tree that starts empty and that no
          # other job writes to. A hosted runner is a fresh VM; the macOS
          # runner instances keep their directories and share one $HOME, so a
          # tree kept there across runs would be the one a run on another ref
          # is compiling into, and this lane could package that run's binary.
          # RUNNER_TEMP belongs to a single runner instance, which runs one
          # job at a time.
          export CARGO_TARGET_DIR="$RUNNER_TEMP/warren-proxy-target"
          rm -rf "$CARGO_TARGET_DIR" out staging
          BIN="$CARGO_TARGET_DIR/$CARGO_TARGET/release/warren-proxy"
          # A rustc that cannot be SPAWNED, one killed mid-compile, and a
          # wedged cargo are the three runner failures this pipeline sees; the
          # classifier retries those and fails anything else on the first
          # attempt (scripts/ci/run-with-runner-retry.sh), which also backs off
          # before retrying into the window it was trying to escape.
          cargo_ci() {
            if [ -n "$WEDGE_TIMEOUT" ]; then
              # Two attempts on a lane whose retry can cost a full wedge
              # timeout: three would put the job's own ceiling out of reach of
              # any reasonable number, and a lane killed by that ceiling
              # reports GitHub's message instead of the wrapper's diagnosis.
              # The cheap signatures (a rustc that never spawned, a tool that
              # vanished) fail in seconds and lose nothing by it.
              WARREN_RETRY_ATTEMPTS=2 \
                bash scripts/ci/run-with-runner-retry.sh timeout -k 60s "$WEDGE_TIMEOUT" "$@"
            else
              bash scripts/ci/run-with-runner-retry.sh "$@"
            fi
          }
          cargo_ci cargo build --locked --release -p warren-proxy --target "$CARGO_TARGET"
          # A tag can be cut on any commit, so nothing else in this pipeline
          # guarantees the code being packaged passed its tests. Release profile
          # and same target as the build above, so it reuses what was just
          # compiled instead of building a second time.
          cargo_ci cargo test --locked --release -p warren-proxy --target "$CARGO_TARGET"
          if [ ! -x "$BIN" ]; then
            echo "cargo reported success but produced no binary at $BIN"; exit 1
          fi
          # Header of this file: ldd is not a static check, a NEEDED entry is.
          case "$CARGO_TARGET" in
            *-musl)
              if command -v readelf >/dev/null 2>&1; then
                if readelf -d "$BIN" | grep -q NEEDED; then
                  echo "binary is dynamically linked:"; readelf -d "$BIN"; exit 1
                fi
              elif command -v file >/dev/null 2>&1; then
                file -b "$BIN" | grep -qE 'static-pie linked|statically linked' || {
                  echo "binary is not static: $(file -b "$BIN")"; exit 1
                }
              else
                echo "no readelf and no file on this runner: cannot verify the binary is static"; exit 1
              fi
              ;;
          esac
          # An artifact nobody can start is worth catching here rather than on
          # a user's machine, and `--version` needs no account and no listener.
          # Printed, so the log of every run names the build its archive holds.
          "$BIN" --version
          name="warren-proxy${ENV_TAG}-${VERSION}-${ASSET_OS}"
          mkdir -p out staging
          cp "$BIN" staging/warren-proxy
          tar -C staging -czf "out/${name}.tar.gz" warren-proxy
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: warren-proxy-${{ matrix.lane }}
          path: out/*
          if-no-files-found: error

  build-windows:
    name: Build windows-x86_64
    needs: resolve
    # Built, tested and packaged by scripts/ci/windows/proxy-windows.sh, every
    # Git Bash step under scripts/ci/windows/watchdog.sh, and handed to publish
    # under the artifact name the matrix lanes use.
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      WARREN_SHA: ${{ github.sha }}
      WARREN_CHANNEL: ${{ needs.resolve.outputs.channel }}
      WARREN_VERSION: ${{ needs.resolve.outputs.version }}
      WARREN_ENV_TAG: ${{ needs.resolve.outputs.env_tag }}
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - run: bash scripts/ci/windows/watchdog.sh bash scripts/ci/windows/proxy-windows.sh prepare
      - run: bash scripts/ci/windows/watchdog.sh bash scripts/ci/windows/proxy-windows.sh build
      - run: bash scripts/ci/windows/watchdog.sh bash scripts/ci/windows/proxy-windows.sh package
      # Only what the packaging step listed in its checksums goes out, and the
      # list itself stays behind: publish writes the release's own SHA256SUMS.
      - name: Verify the packaged outputs
        run: |
          set -euo pipefail
          cd ci-out
          sha256sum -c SHA256SUMS
          for f in *; do
            [ "$f" = SHA256SUMS ] || grep -q " \*\?$f\$" SHA256SUMS || { echo "::error::not in SHA256SUMS: $f"; exit 1; }
          done
          rm SHA256SUMS
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: warren-proxy-windows-x86_64
          path: ci-out/*
          if-no-files-found: error

  publish:
    name: Publish release and image
    needs: [resolve, build, build-windows]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          # Every lane packaged its own asset with its final name, so this job
          # only collects them: no lane's packaging waits for the release to be
          # cut to be exercised, and the dry run covers it too.
          path: staging
      - name: Collect assets and checksums
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          ENV_TAG: ${{ needs.resolve.outputs.env_tag }}
        run: |
          set -euo pipefail
          mkdir -p out dist/amd64 dist/arm64
          find staging -type f -exec mv {} out/ \;
          # No `./` prefix: `sha256sum -c` is run from wherever the assets were
          # downloaded, and the prefix makes every entry a path that has to
          # match. Written outside `out` first, so the file can never end up
          # listing itself.
          (cd out && sha256sum -- *) > SHA256SUMS
          mv SHA256SUMS out/
          # The image is the same binaries the release ships, unpacked from the
          # assets rather than rebuilt.
          tar -C dist/amd64 -xzf "out/warren-proxy${ENV_TAG}-${VERSION}-linux-x86_64-musl.tar.gz"
          tar -C dist/arm64 -xzf "out/warren-proxy${ENV_TAG}-${VERSION}-linux-aarch64-musl.tar.gz"
          chmod 755 dist/amd64/warren-proxy dist/arm64/warren-proxy
          ls -l out dist/amd64 dist/arm64
      # The image is pushed BEFORE the release is created. A release is the
      # announcement, and its notes point at the image: publishing it first and
      # then failing on the push (a transient GHCR denial, a QEMU/buildx setup
      # failure) left a visible release whose image 404s, and the rerun could
      # not recover it because `gh release create` refuses an existing tag.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        # The arm64 layer of the image runs `apk add` under emulation on this
        # x64 runner.
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push multi-arch image
        env:
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          VERSION: ${{ needs.resolve.outputs.version }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = "beta" ]; then
            tags="-t ghcr.io/warrenbrowse/warren-proxy:beta-${VERSION} -t ghcr.io/warrenbrowse/warren-proxy:beta"
          else
            tags="-t ghcr.io/warrenbrowse/warren-proxy:${VERSION} -t ghcr.io/warrenbrowse/warren-proxy:latest"
          fi
          push_image() {
            docker buildx build --push --platform linux/amd64,linux/arm64 \
              -f docker/warren-proxy.Dockerfile $tags .
          }
          # GHCR's token exchange occasionally answers `denied` on the push
          # (transient, documented in warren-core's docker.yml); a fresh login
          # and one retry clears it. A real build error fails twice.
          if ! push_image; then
            echo "::warning::image push failed, re-logging in to GHCR and retrying once"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            push_image
          fi
      - name: Create published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          prerelease=""
          [ "$CHANNEL" = "beta" ] && prerelease="--prerelease"
          # Idempotent: a rerun after a partial publish re-uploads the assets
          # instead of dying on "a release with that tag already exists".
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" out/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "warren-proxy ${CHANNEL} ${VERSION}" \
              --notes "Builds of the headless warren-proxy daemon (${CHANNEL} channel): static musl for Linux x86_64 and aarch64, native for macOS arm64, macOS x86_64 and Windows x86_64. See crates/warren-proxy/README.md for the env contract." \
              $prerelease
          fi
      - name: Check the image is reachable without a GitHub account
        env:
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -uo pipefail
          image=warrenbrowse/warren-proxy
          if [ "$CHANNEL" = "beta" ]; then ref="beta-${VERSION}"; else ref="${VERSION}"; fi
          # A GHCR package is created private, and no REST endpoint flips it:
          # the only way is the package settings page. So the release says so
          # itself rather than leaving every documented `docker run` broken for
          # everyone outside the org until somebody notices.
          token=$(curl -fsSL "https://ghcr.io/token?scope=repository:${image}:pull&service=ghcr.io" \
            | sed -nE 's/.*"token":"([^"]+)".*/\1/p') || token=""
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/${image}/manifests/${ref}")
          if [ "$code" = "200" ]; then
            echo "anonymous pull of ghcr.io/${image}:${ref} answers 200"
          else
            msg="ghcr.io/${image} is not public (anonymous manifest read answered ${code}), so every documented docker run and compose file fails for anyone outside the org. Fix: https://github.com/orgs/WarrenBrowse/packages/container/warren-proxy/settings, Danger Zone, Change visibility, Public."
            echo "::warning::${msg}"
            echo "$msg" >>"$GITHUB_STEP_SUMMARY"
          fi
